[project]
name = "axiom-refiner"
version = "0.1.0"
description = "Elixir-based countermodel refinement with Python ML processes"
requires-python = ">=3.12,<3.13"
dependencies = [
    "llama-server>=0.2.2",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "torch>=2.13.0",
    "torch-geometric>=2.8.0.post1",
]

[dependencies-group]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test/python"]
pythonpath = ["lib/src/graph_ml/python"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8,<9",
    "ruff>=0.15.22",
]
